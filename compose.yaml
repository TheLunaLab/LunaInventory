services:
  mysql:
    image: mysql:8.4
    container_name: luna-mysql

    environment:
      MYSQL_ROOT_PASSWORD: MySecurePassword123!
      MYSQL_DATABASE: lunainventory

    volumes:
      - mysql-data:/var/lib/mysql

    ports:
      - "3306:3306"

    restart: unless-stopped

  app:
    build: .
    container_name: luna-app

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

    restart: unless-stopped

volumes:
  mysql-data: